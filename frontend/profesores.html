<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Profesores - Colegio</title>
    <link rel="stylesheet" href="estilo/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sistema Escolar - Módulo Profesores</h1>
            <nav>
                <a href="profesores.html" class="active">Profesores</a>
                <a href="cursos.html">Cursos</a>
                <a href="estudiantes.html">Estudiantes</a>
            </nav>
        </header>

        <!-- Formulario Crear/Editar -->
        <section class="card-form">
            <h2 id="form-titulo">Agregar Nuevo Profesor</h2>
            <form id="form-profesor">
                <input type="hidden" id="profesor-id">
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" required >
                </div>
                <div class="form-group">
                    <label for="especialidad">Especialidad:</label>
                    <input type="text" id="especialidad" required >
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" required >
                </div>
                <button type="submit" class="btn btn-primary" id="btn-guardar">Guardar Profesor</button>
                <button type="button" class="btn btn-cancel" id="btn-cancelar" style="display:none;" onclick="cancelarEdicion()">Cancelar</button>
            </form>
        </section>

        <!-- Tabla -->
        <section class="table-container">
            <h2>Listado de Profesores</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Especialidad</th>
                        <th>Email</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-profesores">
                    <!-- Filas dinámicas generadas por JavaScript -->
                </tbody>
            </table>
        </section>
    </div>

    <script src="js/profesores.js"></script>
</body>
</html>
