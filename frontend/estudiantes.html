<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Estudiantes - Colegio</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sistema Escolar - Módulo Estudiantes</h1>
            <nav>
                <a href="profesores.html">Profesores</a>
                <a href="cursos.html">Cursos</a>
                <a href="estudiantes.html" class="active">Estudiantes</a>
            </nav>
        </header>

        <!-- Formulario -->
        <section class="card-form">
            <h2 id="form-titulo">Agregar Nuevo Estudiante</h2>
            <form id="form-estudiante">
                <input type="hidden" id="estudiante-id">
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" required >
                </div>
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" required >
                </div>
                <div class="form-group">
                    <label for="curso">Curso Inscrito:</label>
                    <select id="curso" required>
                        <option value="">Cargando cursos...</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" id="btn-guardar">Guardar Estudiante</button>
                <button type="button" class="btn btn-cancel" id="btn-cancelar" style="display:none;" onclick="cancelarEdicion()">Cancelar</button>
            </form>
        </section>

        <!-- Tabla -->
        <section class="table-container">
            <h2>Listado de Estudiantes</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>ID Curso</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-estudiantes">
                    
                    <!-- Filas dinámicas -->
                </tbody>
            </table>
        </section>
    </div>

    <script src="js/estudiantes.js"></script>
</body>
</html>
